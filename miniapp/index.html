<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f8f9">
  <title>Расписание ДГТУ</title>
  <link rel="stylesheet" href="/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="app" class="app" data-season="classic">
    <main id="view" aria-live="polite" aria-busy="true">
      <p class="busy" role="status">Загрузка расписания…</p>
    </main>
    <nav id="navigation" class="navigation" aria-label="Разделы" hidden>
      <!-- Lucide outlines, ISC license: LICENSE.icons. -->
      <button type="button" data-page="schedule"><span class="nav-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M8 15h2M14 15h2M8 18h2"/></svg></span>Расписание</button>
      <button type="button" data-page="changes"><span class="nav-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5M12 7v5l3 2"/></svg></span>Изменения</button>
      <button type="button" data-page="settings"><span class="nav-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></span>Настройки</button>
    </nav>
    <div id="status" class="status-message" role="status" hidden></div>
  </div>
</body>
</html>
